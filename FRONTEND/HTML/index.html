<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ExpenseTracker</h1>
            <p>Track your spending, achieve your goals</p>
        </div>

        <div class="form-container active" id="loginForm">
            <form id="loginFormElement" onsubmit="handleLogin(event)">
                <div class="alert" id="loginAlert"></div>

                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email address" required>
                    <div class="error-message" id="loginEmailError">Please enter a valid email address.</div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">Show</button>
                    </div>
                    <div class="error-message" id="loginPasswordError">Please enter your password.</div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Log In</button>

                <div class="form-footer">
                    <a href="#" onclick="event.preventDefault(); alert('Password reset link will be sent.')">Forgot password?</a>
                    <span class="divider">|</span>
                    <a href="/HTML/registration.html">Create New Account</a>
                </div>
            </form>
        </div>

        <div class="security-badge">Your data is encrypted and secure</div>
    </div>

    <!-- JavaScript Files -->
    <script src="/JS/config.js"></script>
    <script src="/JS/ui.js"></script>
    <script src="/JS/auth.js"></script>
    <script src="/JS/index.js"></script>
    <script src="/JS/app.js"></script>
</body>
</html>
