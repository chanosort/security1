original<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#29945f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ExpenseTracker - Forgot Password</title>
    <link rel="stylesheet" href="/CSS/style2.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* Hides labels to keep your original floating placeholder look */
        .form-group label { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ExpenseTracker</h1>
            <p>Reset your password</p>
        </div>

        <div class="form-container active">
            
            <!-- Step 1: Identify -->
            <div id="step1">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="identifier" placeholder="Email or Username" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Security Check</label>
                    <div style="display: flex; justify-content: center;">
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAGCzxZKx5kkHGIA5"></div>
                    </div>
                </div>
                
                <button class="btn-primary" onclick="identify()">Continue</button>
            </div>

            <!-- Step 2: Questions (Handout Section 10: Choose 1 of 3 registered questions) -->
            <div id="step2" style="display:none">
                <p style="margin-bottom: 15px; font-size: 13px; color: #708079;">Choose one of your registered security questions and verify your answer.</p>
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:6px; color:#2c3e50;">Choose the following question</label>
                    <select id="chooseQuestion" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #ccd0d5; font-size:14px; margin-bottom:12px;"></select>
                </div>
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:6px; color:#2c3e50;">Your Answer</label>
                    <input type="text" id="yourAnswer" placeholder="Your Answer" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #ccd0d5; font-size:14px;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:6px; color:#2c3e50;">Re-enter Answer</label>
                    <input type="text" id="reenterAnswer" placeholder="Re-enter Answer" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #ccd0d5; font-size:14px;">
                </div>
                <button class="btn-primary" onclick="submitAnswers()">Verify Answer</button>
            </div>

            <!-- Step 3: OTP (5-minute expiry) -->
            <div id="step3" style="display:none">
                <p style="margin-bottom: 15px; font-size: 13px; color: #708079;">A 6-digit reset code was sent to your Gmail address.</p>
                <div class="form-group">
                    <label>Reset Code</label>
                    <input type="text" id="otpCode" placeholder="Enter 6-digit code from Gmail" maxlength="6" required autocomplete="off">
                </div>
                <div id="forgotTimer" style="margin-bottom: 15px; font-size: 14px; color: var(--green-700, #20864f); font-weight: 600; text-align: center;">
                    Code expires in: <span id="forgotCountdown">05:00</span>
                </div>
                <button class="btn-primary" id="verifyOtpBtn" onclick="verifyOtp()">Verify Code</button>
                <button type="button" class="btn-secondary" id="resendForgotOtpBtn" style="display:none; margin-top: 10px;" onclick="resendForgotOtp()">Resend Code</button>
            </div>

            <!-- Step 4: Change Password (min 8 chars) -->
            <div id="step4" style="display:none">
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">New Password (minimum 8 characters)</label>
                    <input type="password" id="newPw" placeholder="New password (min 8 chars)" minlength="8" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #ccd0d5; font-size:14px;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Re-enter Password</label>
                    <input type="password" id="newPw2" placeholder="Confirm new password" minlength="8" required style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #ccd0d5; font-size:14px;">
                </div>
                <button class="btn-primary" onclick="changePw()">Change Password</button>
            </div>

            <div class="alert" id="msg" style="margin-top: 15px;"></div>
            
            <div class="form-footer">
                <a href="/">Back to Log In</a>
            </div>
        </div>
        <div class="security-badge">Your data is encrypted and secure</div>
    </div>

    <script>
        let ident='', resetToken='', changeToken='';
        
        function msg(t){ 
            const el = document.getElementById('msg');
            el.textContent = t; 
            el.className = 'alert alert-error show';
        }
        
        async function identify(){
            ident = document.getElementById('identifier').value.trim();
            const tokenInput = document.querySelector('[name="cf-turnstile-response"]');
            const cap = tokenInput ? tokenInput.value : '';

            if(!ident || !cap) { msg("Please complete the security check."); return; }

            const r = await fetch('/api/forgot/identify',{method:'POST',headers:{'Content-Type':'application/json'},
                body: JSON.stringify({identifier: ident, 'cf-turnstile-response': cap})});
            const j = await r.json();
            
            if (!r.ok){ 
                msg(j.error||'Error'); 
                if (window.turnstile) window.turnstile.reset();
                return; 
            }
            
            const qSel = document.getElementById('chooseQuestion');
            if (qSel) {
                qSel.innerHTML = '';
                j.questions.forEach(x => {
                    const opt = document.createElement('option');
                    opt.value = x.question_code;
                    opt.textContent = x.question_text;
                    qSel.appendChild(opt);
                });
            }
            document.getElementById('step1').style.display='none';
            document.getElementById('step2').style.display='block';
            document.getElementById('msg').className = 'alert';
        }
        
        async function submitAnswers(){
            const qSel = document.getElementById('chooseQuestion');
            const selCode = qSel ? qSel.value : '';
            const ans = (document.getElementById('yourAnswer')?.value || '').trim();
            const ans2 = (document.getElementById('reenterAnswer')?.value || '').trim();

            if (!ans) { msg("Please provide your answer."); return; }
            if (ans !== ans2) { msg("Answers do not match."); return; }

            const r = await fetch('/api/forgot/answer',{method:'POST',headers:{'Content-Type':'application/json'},
                body: JSON.stringify({identifier: ident, question_code: selCode, answer: ans, answers: { [selCode]: ans }})});
            const j = await r.json();
            
            if (!r.ok){ msg(j.error||'Error'); return; }
            
            resetToken = j.reset_token;
            // Never pre-fill the OTP code - user must retrieve it from Gmail
            const otpInput = document.getElementById('otpCode');
            if (otpInput) otpInput.value = '';
            document.getElementById('msg').className = 'alert alert-success show';
            document.getElementById('msg').textContent = j.message;
            document.getElementById('step2').style.display='none';
            document.getElementById('step3').style.display='block';
            if (otpInput) otpInput.focus();

            startForgotTimer();
        }

        function startForgotTimer() {
            let rem = 300; // 5 minutes per announcement
            const timerEl = document.getElementById('forgotTimer');
            const countEl = document.getElementById('forgotCountdown');
            const resendBtn = document.getElementById('resendForgotOtpBtn');
            const verifyBtn = document.getElementById('verifyOtpBtn');

            if (resendBtn) resendBtn.style.display = 'none';
            if (verifyBtn) verifyBtn.disabled = false;
            if (timerEl) {
                timerEl.style.color = 'var(--green-700, #20864f)';
                timerEl.innerHTML = 'Code expires in: <span id="forgotCountdown">05:00</span>';
            }

            if (window.forgotTimerInterval) clearInterval(window.forgotTimerInterval);
            window.forgotTimerInterval = setInterval(() => {
                rem--;
                const mins = Math.floor(rem / 60);
                const secs = rem % 60;
                const formatted = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
                const currCountEl = document.getElementById('forgotCountdown');
                if (currCountEl) currCountEl.textContent = formatted;

                if (rem <= 0) {
                    clearInterval(window.forgotTimerInterval);
                    if (timerEl) {
                        timerEl.innerHTML = '<span style="color: #c0392b; font-weight:700;">Code expired (5 min limit). Click Resend Code below.</span>';
                    }
                    if (resendBtn) resendBtn.style.display = 'block';
                }
            }, 1000);
        }

        async function resendForgotOtp(){
            const resendBtn = document.getElementById('resendForgotOtpBtn');
            if (resendBtn) {
                resendBtn.disabled = true;
                resendBtn.textContent = 'Sending new code...';
            }
            try {
                const r = await fetch('/api/resend-forgot-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({reset_token: resetToken})
                });
                const j = await r.json();
                if (resendBtn) {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend Code';
                }
                if (!r.ok) {
                    msg(j.error || 'Failed to resend code.');
                    if (resendBtn) resendBtn.style.display = 'block';
                    return;
                }
                if (j.reset_token) resetToken = j.reset_token;
                const otpInput = document.getElementById('otpCode');
                if (otpInput) {
                    otpInput.value = '';
                    otpInput.focus();
                }
                document.getElementById('msg').className = 'alert alert-success show';
                document.getElementById('msg').textContent = j.message || 'New verification code sent to your Gmail!';
                startForgotTimer();
            } catch(e) {
                if (resendBtn) {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend Code';
                    resendBtn.style.display = 'block';
                }
                msg('Network error while requesting new code.');
            }
        }
        
        async function verifyOtp(){
            const btn = document.getElementById('verifyOtpBtn');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Verifying...';
            }
            const r = await fetch('/api/forgot/verify',{method:'POST',headers:{'Content-Type':'application/json'},
                body: JSON.stringify({reset_token: resetToken, code: document.getElementById('otpCode').value.trim()})});
            const j = await r.json();
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Verify Code';
            }
            
            if (!r.ok){ 
                msg(j.error||'Error');
                // Always reveal Resend Code button if verification fails or code expired
                const resendBtn = document.getElementById('resendForgotOtpBtn');
                if (resendBtn) resendBtn.style.display = 'block';
                return; 
            }
            
            if (window.forgotTimerInterval) clearInterval(window.forgotTimerInterval);
            changeToken = j.change_token;
            document.getElementById('msg').className = 'alert alert-success show';
            document.getElementById('msg').textContent = j.message;
            document.getElementById('step3').style.display='none';
            document.getElementById('step4').style.display='block';
        }
        
        async function changePw(){
            const pw = document.getElementById('newPw').value;
            const pw2 = document.getElementById('newPw2').value;
            if (pw.length < 8) {
                msg("Password must be at least 8 characters.");
                return;
            }
            if (pw !== pw2) {
                msg("Mismatch Password");
                return;
            }
            const r = await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                    change_token: changeToken,
                    password: pw,
                    confirm_password: pw2
                })});
            const j = await r.json();
            
            if (r.ok) {
                document.getElementById('msg').className = 'alert alert-success show';
                document.getElementById('msg').textContent = j.message || 'Successfully Change Password';
                setTimeout(()=>location.href='/', 1500);
            } else {
                msg(j.error);
            }
        }
    </script>
</body>
</html>
